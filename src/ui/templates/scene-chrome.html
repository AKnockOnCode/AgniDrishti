  <!-- FIRE DETECTION REPORT -->
  <style>
    #fire-report-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 320px;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid #ff6600;
      border-radius: 6px;
      color: #ccc;
      font-family: monospace;
      padding: 12px;
      z-index: 1000;
      display: none;
      backdrop-filter: blur(4px);
    }
    #fire-report-panel.visible {
      display: block;
    }
    .fire-report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #443322;
      padding-bottom: 8px;
      margin-bottom: 8px;
      color: #ff8833;
      font-weight: bold;
    }
    .fire-report-close {
      cursor: pointer;
      color: #ff8833;
      background: none;
      border: none;
      font-size: 16px;
    }
    .fire-report-row {
      display: flex;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .fire-report-label {
      width: 100px;
      color: #888;
    }
    .fire-report-value {
      flex: 1;
      color: #ffaa55;
    }
  </style>

  <div id="fire-report-panel">
    <div class="fire-report-header">
      <span>&#128293; FIRE DETECTION REPORT</span>
      <button class="fire-report-close" onclick="document.getElementById('fire-report-panel').classList.remove('visible')">&times;</button>
    </div>
    <div class="fire-report-row"><div class="fire-report-label">Coords</div><div class="fire-report-value" id="fr-coords"></div></div>
    <div class="fire-report-row"><div class="fire-report-label">Label</div><div class="fire-report-value" id="fr-label"></div></div>
    <div class="fire-report-row"><div class="fire-report-label">FRP</div><div class="fire-report-value" id="fr-frp"></div></div>
    <div class="fire-report-row"><div class="fire-report-label">Brightness</div><div class="fire-report-value" id="fr-bright"></div></div>
    <div class="fire-report-row"><div class="fire-report-label">Confidence</div><div class="fire-report-value" id="fr-conf"></div></div>
    <div class="fire-report-row"><div class="fire-report-label">Satellite</div><div class="fire-report-value" id="fr-sat"></div></div>
  </div>

  <script>
    window.addEventListener('fire-selected', (e) => {
      const panel = document.getElementById('fire-report-panel');
      const fire = e.detail;
      if (!fire) {
        panel.classList.remove('visible');
        return;
      }
      
      let label = 'Wildfire / Biomass';
      if (fire.ml_class === 'persistent') label = 'Persistent Thermal Source (Industry)';
      else if (fire.ml_class === 'blast') label = 'Industrial Fire / Hazard (BLAST)';
      else if (fire.ml_class === 'flare') label = 'Industrial Flare';
      else if (fire.ml_class === 'agri') label = 'Agricultural Fire';

      document.getElementById('fr-coords').innerText = fire.lat.toFixed(5) + ' N, ' + fire.lon.toFixed(5) + ' E';
      document.getElementById('fr-label').innerText = label;
      document.getElementById('fr-frp').innerText = fire.frp + ' MW';
      document.getElementById('fr-bright').innerText = fire.brightness + ' K';
      document.getElementById('fr-conf').innerText = Math.round(fire.confidence * 100) + '%';
      document.getElementById('fr-sat').innerText = fire.satellite || fire.sensor || 'N/A';
      
      panel.classList.add('visible');
    });
  </script>
